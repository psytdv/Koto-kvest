.side{width:76px;padding:16px 6px;background:#302447f2;scrollbar-width:thin}
.logo{font-size:9px;letter-spacing:0;text-align:center}.side h2{font-size:13px;text-align:center;margin:12px 0}.side nav button{font-size:0;text-align:center;padding:7px 2px;margin:2px 0;border-radius:9px}.side nav button:before{content:attr(data-n);font-size:15px}.side nav button.done:after{font-size:12px}.side .small{font-size:10px;text-align:center}.side #reset{font-size:10px;padding:8px 3px}.side progress{height:7px}

/* Адаптация для размещения в окне iFrame на доске Meleto. */
html { width: 100%; height: 100%; }
body { min-width: 0; height: 100dvh; }
main { overscroll-behavior: contain; }
footer { position: sticky; bottom: 0; z-index: 11; backdrop-filter: blur(10px); margin-bottom: 0; }
@media (max-width: 1100px) {
  main { padding-left: clamp(10px, 4vw, 60px); padding-right: clamp(10px, 4vw, 60px); }
}
@media (max-width: 550px) {
  main { padding: 10px 8px; }
  .top { flex-wrap: wrap; }
  footer { gap: 4px; }

const tasks=[
{"title":"Три дня распродажи","tag":"Остаток и равные части","text":"В магазине кота Персика за три дня продали 600 кг наполнителя. В первый день — 180 кг, а оставшийся наполнитель продали поровну во второй и третий дни. Сколько килограммов наполнителя продали в первый и второй дни вместе?","fields":[["За первый и второй дни","кг",390]],"hint":"Сначала найди остаток после первого дня. На сколько равных частей его разделили?","steps":["600 − 180 = 420 (кг) — продали во второй и третий дни.","420 : 2 = 210 (кг) — продали во второй день.","180 + 210 = 390 (кг) — продали за первые два дня."],"answer":"390 кг."},
{"title":"Склад кото-магазина","tag":"Количество × масса","text":"Котята привезли в магазин 5 контейнеров сухого корма по 40 кг и 5 контейнеров наполнителя по 35 кг. За первый день продали 120 кг корма и 140 кг наполнителя. Сколько всего килограммов корма и наполнителя осталось продать?","fields":[["Всего осталось","кг",115]],"hint":"Найди общую массу привезённого и общую массу проданного.","steps":["40 · 5 = 200 (кг) — привезли корма.","35 · 5 = 175 (кг) — привезли наполнителя.","200 + 175 = 375 (кг) — привезли всего.","120 + 140 = 260 (кг) — продали всего.","375 − 260 = 115 (кг) — осталось."],"answer":"115 кг."},
{"title":"Две недели в кафе","tag":"Два варианта условия","text":"В кафе котёнка Пикселя в первую неделю расходовали по 70 л воды в рабочий день, а во вторую — по 80 л. Сколько литров воды израсходовали за две недели, если кафе работало: а) по 5 дней в неделю; б) по 6 дней в неделю? Реши оба варианта.","fields":[["а) По 5 дней в неделю","л",750],["б) По 6 дней в неделю","л",900]],"hint":"Число рабочих дней в обе недели одинаковое. Сложи дневные расходы и умножь на число дней.","steps":["70 + 80 = 150 (л) — сумма расходов за один день первой и один день второй недели.","а) 150 · 5 = 750 (л). Можно так: 70 · 5 + 80 · 5.","б) 150 · 6 = 900 (л). Можно так: 70 · 6 + 80 · 6."],"answer":"а) 750 л; б) 900 л."},
{"title":"Робот против шерсти","tag":"В несколько раз меньше","text":"В кото-клубе две комнаты. Первую робот-пылесос убирает за 42 мин, а вторую — в 3 раза быстрее, то есть затрачивает в 3 раза меньше времени. Сколько минут нужно роботу на уборку обеих комнат?","fields":[["Общее время","мин",56]],"hint":"«В 3 раза меньше» означает деление на 3. После этого найди общее время.","steps":["42 : 3 = 14 (мин) — уборка второй комнаты.","42 + 14 = 56 (мин) — уборка двух комнат."],"answer":"56 минут."},
{"title":"Модный кото-дроп","tag":"Расход материала","text":"В мастерской котят из 106 м ткани сшили 18 плащей и несколько костюмов для большого фестиваля. На каждый плащ ушло 5 м ткани, а на каждый костюм — на 1 м меньше. Сколько костюмов сшили?","fields":[["Сшили костюмов","шт.",4]],"hint":"Узнай расход на плащи, затем остаток ткани и расход на один костюм.","steps":["5 · 18 = 90 (м) — ткань на плащи.","106 − 90 = 16 (м) — осталось на костюмы.","5 − 1 = 4 (м) — расход на один костюм.","16 : 4 = 4 (костюма)."],"answer":"4 костюма."},
{"title":"Секрет трёх цветов","tag":"Суммы по парам · вызов","text":"Котята приготовили для фестиваля бумажные цветы трёх цветов: красного, белого и розового. Белых и розовых вместе — 400, розовых и красных — 300, белых и красных — 240. Сколько цветов каждого цвета приготовили?","fields":[["Красных","шт.",70],["Белых","шт.",170],["Розовых","шт.",230]],"hint":"Сложи три суммы. Каждый цветок будет посчитан дважды. Как найти общее количество?","steps":["400 + 300 + 240 = 940 — удвоенное количество всех цветов.","940 : 2 = 470 (цветов) — всего.","470 − 400 = 70 (цветов) — красные.","470 − 300 = 170 (цветов) — белые.","470 − 240 = 230 (цветов) — розовые.","Проверка: 170 + 230 = 400; 230 + 70 = 300; 170 + 70 = 240."],"answer":"70 красных, 170 белых, 230 розовых."},
{"title":"Швейный баттл","tag":"Производительность и время","text":"Две кошки-мастерицы работали одинаковое время. Первая сшила 12 наволочек, изготавливая по 3 наволочки в час. Сколько пододеяльников сшила вторая, если каждый час она шила по 2 пододеяльника?","fields":[["Вторая мастерица сшила","шт.",8]],"hint":"По работе первой мастерицы найди время. У второй время такое же.","steps":["12 : 3 = 4 (ч) — работала каждая мастерица.","2 · 4 = 8 (пододеяльников) — сшила вторая."],"answer":"8 пододеяльников."},
{"title":"Коробки с сюрпризом","tag":"Разностное сравнение","text":"В кото-магазине осталось 840 пачек наклеек с рыжими котятами, а с серыми — в 3 раза меньше. На сколько больше осталось пачек с рыжими котятами, чем с серыми?","fields":[["На сколько больше","пачек",560]],"hint":"Сначала узнай число пачек с серыми котятами. Затем сравни количества вычитанием.","steps":["840 : 3 = 280 (пачек) — с серыми котятами.","840 − 280 = 560 (пачек) — разница."],"answer":"На 560 пачек больше."},
{"title":"Большая доставка","tag":"Два вида коробок","text":"Котята получили 48 коробок пластилина. В 16 коробках был фиолетовый пластилин, по 9 кг в каждой. В остальных — зелёный, по 8 кг в каждой. Сколько всего килограммов пластилина привезли?","fields":[["Всего пластилина","кг",400]],"hint":"У остальных коробок другая масса. Сначала найди их количество.","steps":["48 − 16 = 32 (коробки) — с зелёным пластилином.","16 · 9 = 144 (кг) — фиолетовый пластилин.","32 · 8 = 256 (кг) — зелёный пластилин.","144 + 256 = 400 (кг) — всего."],"answer":"400 кг."},
{"title":"Доставка наоборот","tag":"Обратная задача","text":"В мастерскую котят привезли 400 кг фиолетового и зелёного пластилина. Фиолетовый лежал в нескольких коробках, по 9 кг в каждой. Зелёный — в 32 коробках, по 8 кг в каждой. Сколько коробок фиолетового пластилина привезли?","fields":[["Коробок фиолетового пластилина","шт.",16]],"hint":"Из общей массы вычти массу зелёного пластилина. Что покажет деление остатка на 9?","steps":["32 · 8 = 256 (кг) — зелёный пластилин.","400 − 256 = 144 (кг) — фиолетовый пластилин.","144 : 9 = 16 (коробок) — фиолетовый пластилин."],"answer":"16 коробок."},
{"title":"Батарейка на нуле?","tag":"Деление с остатком","text":"Робот-пылесос котят на одном полном заряде убирает 50 м². Сколько полных зарядов потребуется для уборки дома площадью 120 м²? Считай все заряды, включая первый, с которым робот начинает уборку.","fields":[["Потребуется зарядов","шт.",3]],"hint":"Двух зарядов хватит на 100 м². Можно ли оставить остальные 20 м² неубранными?","steps":["50 · 2 = 100 (м²) — уберёт на двух зарядах.","120 − 100 = 20 (м²) — останется убрать.","Для оставшихся 20 м² нужен ещё один заряд: 2 + 1 = 3.","Если робот уже полностью заряжен перед стартом, во время уборки его придётся подзарядить ещё 2 раза."],"answer":"3 полных заряда, включая начальный."},
{"title":"Что разобрали быстрее?","tag":"Сравнение проданного","text":"Утром в магазине Персика было 380 кг корма для взрослых кошек и 180 кг корма для котят. К закрытию осталось соответственно 295 кг и 106 кг. Какого корма продали больше и на сколько килограммов?","fields":[["На сколько больше","кг",11]],"choice":{"label":"Какого корма продали больше?","options":["Для взрослых кошек","Для котят"],"key":0},"hint":"Сравни не утренние запасы, а проданные количества каждого вида.","steps":["380 − 295 = 85 (кг) — продали корма для взрослых кошек.","180 − 106 = 74 (кг) — продали корма для котят.","85 > 74; 85 − 74 = 11 (кг)."],"answer":"Корма для взрослых кошек продали на 11 кг больше."},
{"title":"Цена без чисел","tag":"Буквенное выражение","text":"В кото-магазине за два дня продали 100 одинаковых худи по одной цене. В первый день получили a рублей, во второй — c рублей. Запиши выражение, которое показывает цену одного худи.","expression":true,"fields":[["Цена одного худи","руб.","(a+c):100"]],"hint":"Сначала найди общую выручку за два дня. Чтобы получить цену, раздели стоимость на количество.","steps":["a + c (руб.) — получили за все 100 худи.","(a + c) : 100 (руб.) — цена одного худи.","Скобки нужны, чтобы сначала сложить выручку за оба дня."],"answer":"(a + c) : 100 рублей."}
]

function render(){let p=state.page,t=task(),h='';if(p===0)h=`<div class="hero"><div><div class="eyebrow">Персик и Пиксель на связи</div><h1>Когда задача<br>не решится сама</h1><p>Помоги котятам разобраться с доставкой, мастерской и роботом-пылесосом.</p><div><span class="chip">4 класс</span><span class="chip">13 задач</span><span class="chip">Можно пройти в 2 занятия</span></div><p class="muted">Сначала план, потом вычисления. У каждой задачи есть черновик, подсказка и подробный образец решения.</p><div class="actions"><button class="primary" onclick="go(1)">Погнали решать →</button></div><p class="small muted">Числа и математические связи сохранены из твоих заданий. Сюжеты — из кото-города.</p></div><img src="${images[0]}" alt="Котята Персик и Пиксель с блокнотом"></div>`;else if(p===1)h=`<div class="head"><div><div class="eyebrow">Режим: думаю, а не угадываю</div><h1>План решения</h1></div><img src="${images[1]}" alt="Котята думают над задачей"></div><ol><li><b>Прочитай условие.</b> Что известно? Что нужно найти?</li><li><b>Сделай краткую запись</b> или схему в черновике.</li><li><b>Составь план.</b> Можно ли сразу ответить на вопрос?</li><li><b>Вычисли и объясни действия.</b> Запиши решение в поле или карандашом.</li><li><b>Впиши ответ и проверь.</b> При ошибке можно исправить ответ или повторить попытку.</li></ol><div class="problem"><b>Не путай:</b><br>на 3 меньше → вычесть 3;<br>в 3 раза меньше → разделить на 3;<br>на сколько больше → найти разность.</div><p>В числовые поля вводи только число — единицы уже указаны. В последней задаче запиши выражение с буквами.</p><p class="small muted">Верхний карандаш рисует поверх страницы. Чтобы нажимать кнопки и вводить ответы, выключи его. Черновик внизу работает отдельно.</p>`;else if(t){let a=answers(),c=state.checks[p];h=`<div class="head"><div><div class="eyebrow">Задача ${p-1} / ${tasks.length} · ${t.tag}</div><h1>${t.title}</h1></div><img src="${images[1]}" alt="Персик и Пиксель размышляют"></div><div class="problem">${t.text}</div><label for="notes"><b>Моё решение и пояснения</b></label><p class="small muted">Запиши действия или используй черновик ниже. Текст решения сравни с образцом самостоятельно.</p><textarea id="notes" placeholder="1) … — узнаю …&#10;2) … — узнаю …" oninput="state.notes[state.page]=this.value;save()">${esc(state.notes[p])}</textarea>${t.choice?`<div class="field"><label for="choice">${t.choice.label}</label><select id="choice" onchange="update('choice',this.value)"><option value="">Выбери</option>${t.choice.options.map((v,i)=>`<option value="${i}" ${String(a.choice)===String(i)?'selected':''}>${v}</option>`).join('')}</select></div>`:''}${t.fields.map((f,i)=>`<div class="field"><label for="answer${i}">${f[0]}</label><input id="answer${i}" ${t.expression?'style="width:230px"':'inputmode="numeric"'} type="text" autocomplete="off" value="${esc(a[i])}" class="${c?c.results[i]?'good':'bad':''}" oninput="update('${i}',this.value)"><span>${f[1]}</span></div>`).join('')}${t.expression?'<p class="small muted">Можно вводить a и c латиницей или а и с кириллицей; деление — знаком : или /.</p>':''}<div class="actions"><button class="primary" onclick="check()">Проверить ответ</button><button onclick="retry()">Повторная попытка</button><button onclick="toggle('hints')">${state.hints[p]?'Скрыть подсказку':'Подсказка'}</button><button onclick="toggle('samples')">${state.samples[p]?'Скрыть решение':'Образец решения'}</button></div><div class="feedback ${c?.ok?'good':''}" id="feedback" role="status">${c?c.ok?'Верно! Котики одобряют. Сравни ход решения с образцом.':c.message:''}</div>${state.hints[p]?`<div class="hint"><b>Подсказка</b><p>${t.hint}</p></div>`:''}${state.samples[p]?`<div class="solution"><h2>Один из способов решения</h2><ol>${t.steps.map(s=>`<li>${s}</li>`).join('')}</ol><b>Ответ: ${t.answer}</b><p class="small muted">Другой верный способ тоже подходит. Проверь смысл действий и единицы измерения.</p></div>`:''}<section class="draft"><h2>Черновик</h2><p class="small muted">Здесь можно рисовать сразу. Цвет и толщина — в верхней панели. Рисунок сохраняется для этой задачи.</p><div class="draftbar"><button id="draftPen" onclick="draftErase=false;draftUI()">Карандаш</button><button id="draftEraser" onclick="draftErase=true;draftUI()">Ластик</button><button onclick="state.drafts[state.page]=[];paint($('scratch'),'drafts');save()">Очистить черновик</button></div><div class="scratchBox"><canvas id="scratch" aria-label="Черновик к задаче"></canvas></div></section>`}else{let n=tasks.filter((_,i)=>state.checks[i+2]?.ok).length;h=`<div class="hero"><div><div class="eyebrow">Финальный мур-момент</div><h1>${n===tasks.length?'Все задачи решены!':'Твой результат'}</h1><div class="score">${n} / ${tasks.length}</div><p>задач с верным ответом.</p><p>Проверь, можешь ли ты объяснить каждое действие. Это важнее быстрого ответа.</p><div id="review">${tasks.map((t,i)=>`<button onclick="go(${i+2})">${state.checks[i+2]?.ok?'✓':'○'} Задача ${i+1}</button>`).join('')}</div><p class="small muted">Урок на Play · Орлова А. Р.</p></div><img src="${images[2]}" alt="Котята празднуют с кубком"></div>`}$('page').innerHTML=h;nav();$('back').disabled=p===0;$('next').disabled=p===titles.length-1;$('pageCount').textContent=`Экран ${p+1} из ${titles.length}`;if($('scratch')){bind($('scratch'),'drafts');draftUI()}requestAnimationFrame(resizeAll);save()}
function go(p){active=null;state.page=Math.max(0,Math.min(titles.length-1,p));render();document.querySelector('main').scrollTop=0;window.scrollTo(0,0)}function toggle(k){state[k][state.page]=!state[k][state.page];render()}
function expr(s){return String(s??'').toLowerCase().replace(/а/g,'a').replace(/с/g,'c').replace(/\s/g,'').replace(/[÷/]/g,':').replace(/[＋]/g,'+')}
function check(){let t=task(),a=answers();let results=t.fields.map((f,i)=>t.expression?['(a+c):100','(c+a):100','a:100+c:100','c:100+a:100'].includes(expr(a[i])):/^\d+$/.test(String(a[i]??'').trim())&&Number(a[i])===f[2]);let choice=!t.choice||String(a.choice)===String(t.choice.key);let ok=results.every(Boolean)&&choice;state.checks[state.page]={results,ok,message:!choice?'Проверь, какого товара продали больше, и разницу в килограммах.':'Пока не всё верно. Проверь выделенные поля, действия и вопрос задачи. Можно открыть подсказку.'};beep(ok);render()}
function retry(){delete state.answers[state.page];delete state.checks[state.page];render()}
function draftUI(){$('draftPen')?.classList.toggle('selected',!draftErase);$('draftEraser')?.classList.toggle('selected',draftErase)}
function resize(c,k){if(!c)return;let r=c.getBoundingClientRect(),d=window.devicePixelRatio||1;c.width=Math.round(r.width*d);c.height=Math.round(r.height*d);c.getContext('2d').setTransform(d,0,0,d,0,0);paint(c,k)}function resizeAll(){resize($('overlay'),'ink');resize($('scratch'),'drafts')}
function paint(c,k){if(!c)return;let ctx=c.getContext('2d'),w=c.clientWidth,h=c.clientHeight;ctx.clearRect(0,0,w,h);for(let s of state[k][state.page]||[]){ctx.globalCompositeOperation=s.erase?'destination-out':'source-over';ctx.strokeStyle=s.color;ctx.fillStyle=s.color;ctx.lineWidth=s.width;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();s.points.forEach((p,i)=>i?ctx.lineTo(p[0]*w,p[1]*h):ctx.moveTo(p[0]*w,p[1]*h));if(s.points.length===1){let p=s.points[0];ctx.arc(p[0]*w,p[1]*h,s.width/2,0,Math.PI*2);ctx.fill()}else ctx.stroke()}ctx.globalCompositeOperation='source-over'}
function bind(c,k){function point(e){let r=c.getBoundingClientRect();return[(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]}c.onpointerdown=e=>{if(k==='ink'&&!mode)return;e.preventDefault();c.setPointerCapture(e.pointerId);let er=k==='ink'?erase:draftErase;active={canvas:c,kind:k,stroke:{erase:er,color:$('color').value,width:+$('thick').value*(er?4:1),points:[point(e)]}};(state[k][state.page]??=[]).push(active.stroke);paint(c,k)};c.onpointermove=e=>{if(active?.canvas===c){active.stroke.points.push(point(e));paint(c,k)}};c.onpointerup=c.onpointercancel=c.onlostpointercapture=()=>{if(active?.canvas===c){active=null;save()}}}
function modeUI(){$('overlay').classList.toggle('on',mode);$('pen').textContent='Поверх страницы: '+(mode?'вкл.':'выкл.');$('pen').setAttribute('aria-pressed',mode);$('pen').classList.toggle('selected',mode&&!erase);$('eraser').classList.toggle('selected',mode&&erase);$('drawNote').textContent=mode?'Для ввода ответов выключи рисование.':''}
$('pen').onclick=()=>{mode=!mode;erase=false;modeUI()};$('eraser').onclick=()=>{mode=true;erase=!erase;modeUI()};$('clearPage').onclick=()=>{state.ink[state.page]=[];paint($('overlay'),'ink');save()};$('sound').onclick=()=>{sound=!sound;$('sound').textContent='Звук: '+(sound?'включён':'выключен');$('sound').setAttribute('aria-pressed',sound);beep(true)};$('back').onclick=()=>go(state.page-1);$('next').onclick=()=>go(state.page+1);$('reset').onclick=()=>$('resetDialog').showModal();$('cancelReset').onclick=()=>$('resetDialog').close();$('confirmReset').onclick=()=>{state=fresh();mode=false;erase=false;draftErase=false;active=null;modeUI();$('resetDialog').close();render()};bind($('overlay'),'ink');new ResizeObserver(resizeAll).observe($('wrap'));render();
</script></body></html>
